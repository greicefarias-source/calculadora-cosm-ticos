<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custos | Cosméticos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4A574;
            --dark: #1a1a1a;
            --light-bg: #f9f7f4;
            --border: #e0dcd7;
            --text: #2a2a2a;
            --white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light-bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 0.95rem;
            color: #666;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 1rem;
            color: #999;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--dark);
            border-bottom-color: var(--gold);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 4px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: var(--dark);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        .inline-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        .exchange-rates {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #fafaf8;
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .rate-display {
            text-align: center;
        }

        .rate-display .currency {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .rate-display .value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gold);
        }

        .line-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-card {
            background: #fafaf8;
            padding: 1.5rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .product-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .product-size {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 1rem;
        }

        .formula-list {
            font-size: 0.8rem;
            margin-bottom: 1rem;
            max-height: 150px;
            overflow-y: auto;
            color: #666;
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 3px;
        }

        .formula-item {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .formula-item:last-child {
            border-bottom: none;
        }

        .cost-display {
            background: var(--white);
            padding: 1rem;
            border-radius: 3px;
            border: 2px solid var(--gold);
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .cost-row {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
        }

        .cost-row.total {
            font-weight: 600;
            color: var(--gold);
            border-top: 1px solid var(--gold);
            padding-top: 0.5rem;
            margin-top: 0.5rem;
        }

        .markup-section {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 3px;
            margin-top: 1rem;
        }

        .markup-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--dark);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .markup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .markup-input {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .markup-input input {
            width: 60px;
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 0.8rem;
        }

        .markup-input label {
            font-size: 0.8rem;
            color: #666;
            flex: 1;
        }

        .breakdown {
            background: var(--white);
            padding: 0.75rem;
            border-radius: 3px;
            border: 1px solid var(--border);
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            font-size: 0.8rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .breakdown-item:last-child {
            border-bottom: none;
        }

        .breakdown-item.total {
            font-weight: 600;
            color: var(--gold);
            border-top: 1px solid var(--gold);
            padding-top: 0.5rem;
            margin-top: 0.5rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #c39560;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--border);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #d0ccc7;
        }

        /* MODAL STYLES */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--white);
            border-radius: 5px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--dark);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: var(--dark);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        .form-section {
            background: var(--light-bg);
            padding: 1rem;
            border-radius: 3px;
            margin: 1.5rem 0;
        }

        .form-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mp-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .mp-item-info {
            flex: 1;
        }

        .mp-item-nome {
            font-weight: 600;
            color: var(--dark);
        }

        .mp-item-grama {
            color: #666;
            font-size: 0.8rem;
        }

        .mp-item-remove {
            background: #ff6b6b;
            color: var(--white);
            border: none;
            padding: 0.3rem 0.7rem;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .mp-item-remove:hover {
            background: #ff5252;
        }

        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 3px;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: 600;
        }

        /* LOGIN SCREEN */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark) 0%, #2a3a3a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-container {
            background: var(--white);
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--dark);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 2rem;
        }

        .login-input-group {
            margin-bottom: 1.5rem;
        }

        .login-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 5px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 1rem;
            background: var(--gold);
            color: var(--white);
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-button:hover {
            background: #c39560;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 165, 116, 0.3);
        }

        .login-error {
            background: #f8d7da;
            color: #721c24;
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--gold);
            color: white;
        }

        .btn-primary:hover {
            background: #c49463;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
        }

        .success-msg {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .inline-group {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-container">
            <h1 class="login-title">Calculadora de Custos</h1>
            <p class="login-subtitle">Acesso restrito</p>
            
            <div id="loginError" class="login-error"></div>
            
            <form id="loginForm" onsubmit="validarSenha(event)">
                <div class="login-input-group">
                    <input 
                        type="password" 
                        id="passwordInput" 
                        class="login-input" 
                        placeholder="Digite sua senha"
                        autocomplete="off"
                    >
                </div>
                <button type="submit" class="login-button">Acessar</button>
            </form>
        </div>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <div class="header">
            <h1>Calculadora de Custos</h1>
            <p>62 produtos em 16 linhas cosméticas premium</p>
        </div>

        <div id="successMsg"></div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="materiais">Matérias-Primas</button>
            <button class="tab-btn" data-tab="produtos">Produtos & Custos</button>
            <button class="tab-btn" data-tab="embalagem">Embalagem</button>
        </div>

        <!-- TAB MATÉRIAS-PRIMAS -->
        <div id="materiais" class="tab-content active">
            <div class="section">
                <div class="section-title">Cotação de Câmbio (Padrão)</div>
                <div class="exchange-rates">
                    <div class="rate-display">
                        <div class="currency">USD</div>
                        <div class="value">R$ <span id="usdRate">5.16</span></div>
                    </div>
                    <div class="rate-display">
                        <div class="currency">EUR</div>
                        <div class="value">R$ <span id="eurRate">5.92</span></div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Preços de Matérias-Primas (R$ por 1000g)</div>
                <div class="grid" id="materiaisList"></div>
            </div>
        </div>

        <!-- TAB PRODUTOS -->
        <div id="produtos" class="tab-content">
            <div class="button-group" style="margin-bottom: 2rem;">
                <button class="btn btn-primary" onclick="abrirModalNovoProduto()">+ Novo Produto</button>
                <button class="btn btn-primary" onclick="exportarPDF()">📄 Exportar PDF</button>
                <button class="btn btn-secondary" onclick="exportarDados()">Exportar JSON</button>
            </div>
            <div id="linhasProdutos"></div>
        </div>

        <!-- TAB EMBALAGEM -->
        <div id="embalagem" class="tab-content">
            <div id="linhasEmbalagem"></div>
        </div>

        <!-- MODAL NOVO PRODUTO -->
        <div id="modalNovoProduto" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Criar Novo Produto</h2>
                    <button class="close-btn" onclick="fecharModalNovoProduto()">&times;</button>
                </div>
                
                <div class="modal-body">
                    <!-- Linha -->
                    <div class="form-group">
                        <label>Selecione a Linha:</label>
                        <select id="selectLinha">
                            <option value="">-- Escolha uma linha --</option>
                        </select>
                    </div>

                    <!-- Nome do Produto -->
                    <div class="form-group">
                        <label>Nome do Produto:</label>
                        <input type="text" id="inputNomeProduto" placeholder="Ex: Shampoo Premium">
                    </div>

                    <!-- Tamanho -->
                    <div class="form-group">
                        <label>Tamanho (gramas):</label>
                        <input type="number" id="inputTamanhoProduto" placeholder="Ex: 300" min="1">
                    </div>

                    <!-- Adicionar MPs -->
                    <div class="form-section">
                        <div class="form-title">Adicionar Matérias-Primas</div>
                        
                        <div class="form-group">
                            <label>Matéria-Prima:</label>
                            <select id="selectMP">
                                <option value="">-- Escolha uma MP --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Gramatura (g):</label>
                            <input type="number" id="inputGramatura" placeholder="Ex: 100" min="0" step="0.1">
                        </div>

                        <button class="btn btn-secondary" onclick="adicionarMPTemporaria()">+ Adicionar MP</button>
                    </div>

                    <!-- Lista de MPs Adicionadas -->
                    <div class="form-section" id="secaoMPsAdicionadas" style="display: none;">
                        <div class="form-title">Matérias-Primas Adicionadas</div>
                        <div id="listaMPsTemporarias"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModalNovoProduto()">Cancelar</button>
                    <button class="btn btn-primary" onclick="criarNovoProduto()">Criar Produto</button>
                </div>
            </div>
        </div>
    </div>

            if (senha === SENHA_PADRAO) {
                // Senha correta - salvar em sessionStorage
                sessionStorage.setItem('autenticado', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                init();
            } else {
                // Senha incorreta
                const errorDiv = document.getElementById('loginError');
                errorDiv.textContent = '❌ Senha incorreta. Tente novamente.';
                errorDiv.style.display = 'block';
                input.value = '';
                input.focus();
                
                // Limpar mensagem após 3 segundos
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            }
        }

        function verificarAutenticacao() {

                document.getElementById('mainContent').style.display = 'block';

        function adicionarMPTemporaria() {
            const selectMP = document.getElementById('selectMP');
            const inputGramatura = document.getElementById('inputGramatura');
            
            const mp = selectMP.value;
            const grama = parseFloat(inputGramatura.value);

            if (!mp) {
                alert('Selecione uma matéria-prima!');
                return;
            }

            if (!grama || grama <= 0) {
                alert('Digite uma gramatura válida!');
                return;
            }

            // Verificar se já existe
            const existe = mpTemporarias.find(m => m.nome === mp);
            if (existe) {
                alert('Esta matéria-prima já foi adicionada! Use o valor diferente ou remova a anterior.');
                return;
            }

            mpTemporarias.push({
                nome: mp,
                grama: grama
            });

            selectMP.value = '';
            inputGramatura.value = '';
            atualizarListaMPsTemporarias();
        }

        function removerMPTemporaria(index) {
            mpTemporarias.splice(index, 1);
            atualizarListaMPsTemporarias();
        }

        function atualizarListaMPsTemporarias() {
            const lista = document.getElementById('listaMPsTemporarias');
            const secao = document.getElementById('secaoMPsAdicionadas');
            
            if (mpTemporarias.length === 0) {
                secao.style.display = 'none';
                lista.innerHTML = '';
                return;
            }

            secao.style.display = 'block';
            lista.innerHTML = mpTemporarias.map((mp, idx) => `
                <div class="mp-item">
                    <div class="mp-item-info">
                        <div class="mp-item-nome">${mp.nome}</div>
                        <div class="mp-item-grama">${mp.grama}g</div>
                    </div>
                    <button class="mp-item-remove" onclick="removerMPTemporaria(${idx})">Remover</button>
                </div>
            `).join('');
        }

        function criarNovoProduto() {
            const linha = document.getElementById('selectLinha').value;
            const nome = document.getElementById('inputNomeProduto').value;
            const tamanho = parseFloat(document.getElementById('inputTamanhoProduto').value);

            if (!linha) {
                alert('Selecione uma linha!');
                return;
            }

            if (!nome.trim()) {
                alert('Digite um nome para o produto!');
                return;
            }

            if (!tamanho || tamanho <= 0) {
                alert('Digite um tamanho válido!');
                return;
            }

            if (mpTemporarias.length === 0) {
                alert('Adicione pelo menos uma matéria-prima!');
                return;
            }

            // Criar fórmula
            const formula = {};
            mpTemporarias.forEach(mp => {
                formula[mp.nome] = mp.grama;
            });

            const novoProduto = {
                linha: linha,
                nome: nome,
                tamanho: tamanho,
                formula: formula,
                customizado: true
            };

            produtosCustomizados.push(novoProduto);
            salvarProdutosCustomizados();
            
            // Adicionar aos percentuais e embalagem
            const key = `${linha}-${nome}`;
            percentuais[key] = { administrativo: 30, impostos: 40, comissoes: 20, frete: 10, lucro: 100 };
            packaging[key] = { tampa: 0, rotulo: 0, embalagem: 0 };

            fecharModalNovoProduto();
            renderProdutos();

            const msg = document.getElementById('successMsg');
            msg.innerHTML = '<div class="success-msg">✅ Produto criado com sucesso!</div>';
            setTimeout(() => {
                msg.innerHTML = '';
            }, 3000);
        }

        function deletarProdutoCustomizado(linha, nome) {
            if (!confirm(`Tem certeza que deseja deletar "${nome}"?`)) {
                return;
            }

            const index = produtosCustomizados.findIndex(p => p.linha === linha && p.nome === nome);
            if (index !== -1) {
                produtosCustomizados.splice(index, 1);
                salvarProdutosCustomizados();
                
                // Remover dos percentuais e embalagem
                const key = `${linha}-${nome}`;
                delete percentuais[key];
                delete packaging[key];
                
                renderProdutos();
            }
        }

        // INICIALIZAR

            carregarProdutosCustomizados();

            initPackaging();
            renderMateriais();
            renderProdutos();
            renderEmbalagem();
            setupTabs();
        }

        function initPackaging() {
            Object.keys(linhas).forEach(linha => {
                linhas[linha].forEach(produto => {
                    const key = `${linha}-${produto.nome}`;
                    packaging[key] = { tampa: 0, rotulo: 0, embalagem: 0 };
                    percentuais[key] = { administrativo: 30, impostos: 40, comissoes: 20, frete: 10, lucro: 100 };
                });
            });
        }

        // LOCALSTORAGE PARA MATÉRIAS-PRIMAS
        function salvarMateriaisPrimas() {
            localStorage.setItem('materialValues', JSON.stringify(materialValues));
            localStorage.setItem('materialCurrencies', JSON.stringify(materialCurrencies));
        }

        function carregarMateriaisPrimas() {
            const savedValues = localStorage.getItem('materialValues');
            const savedCurrencies = localStorage.getItem('materialCurrencies');

            if (savedValues) {
                materialValues = JSON.parse(savedValues);
            }
            if (savedCurrencies) {
                materialCurrencies = JSON.parse(savedCurrencies);
            }

            // Recalcular preços com os valores carregados
            Object.keys(materialValues).forEach(mp => {
                materialPrices[mp] = calcularPrecoMP(mp);
            });
        }

        function calcularPrecoMP(mp) {
            const valor = materialValues[mp] || 0;
            const moeda = materialCurrencies[mp] || 'BRL';
            const cotacao = cotacoes[moeda] || 1;
            return valor * cotacao;
        }

        function atualizarPrecoMP(mp, valor, moeda) {
            materialValues[mp] = valor;
            materialCurrencies[mp] = moeda;
            materialPrices[mp] = calcularPrecoMP(mp);
            salvarMateriaisPrimas(); // SALVA NO LOCALSTORAGE
            renderMateriais();
            renderProdutos();
        }

        function calcularCustoProduto(produto) {
            let custo = 0;
            Object.keys(produto.formula).forEach(ing => {
                const qtd = produto.formula[ing];
                const precoMPPor1000g = materialPrices[ing] || 0;
                const custoPorGrama = precoMPPor1000g / 1000;
                custo += custoPorGrama * qtd;
            });
            return custo;
        }

        function calcularPrecoFinal(custoBase, linha, nomeProduto) {
            const key = `${linha}-${nomeProduto}`;
            const perc = percentuais[key] || { administrativo: 30, impostos: 40, comissoes: 20, frete: 10, lucro: 100 };
            
            const administrativo = (custoBase * perc.administrativo) / 100;
            const impostos = (custoBase * perc.impostos) / 100;
            const comissoes = (custoBase * perc.comissoes) / 100;
            const frete = (custoBase * perc.frete) / 100;
            const lucro = (custoBase * perc.lucro) / 100;
            
            return {
                administrativo,
                impostos,
                comissoes,
                frete,
                lucro,
                total: custoBase + administrativo + impostos + comissoes + frete + lucro
            };
        }

                            <div class="markup-section">

                                <div class="markup-grid">

                                    <div class="markup-input">

                                    <div class="breakdown-item">
                                        <span>+ Impostos (${perc.impostos}%):</span>

                                        <span>+ Comissões (${perc.comissoes}%):</span>
                                        <span>R$ ${precoFinal.comissoes.toFixed(2)}</span>
                                    </div>
                                    <div class="breakdown-item">
                                        <span>+ Frete (${perc.frete}%):</span>
                                        <span>R$ ${precoFinal.frete.toFixed(2)}</span>

                                        <span>R$ ${precoFinal.total.toFixed(2)}</span>

                            </div>

                    `;

                const customizados = produtosCustomizados.filter(p => p.linha === linha);
                customizados.forEach(produto => {
                    const custo = calcularCustoProduto(produto);
                    const packKey = `${linha}-${produto.nome}`;
                    const pack = packaging[packKey] || { tampa: 0, rotulo: 0, embalagem: 0 };
                    const packTotal = pack.tampa + pack.rotulo + pack.embalagem;
                    const custoBase = custo + packTotal;
                    const perc = percentuais[packKey] || { administrativo: 30, impostos: 40, comissoes: 20, frete: 10, lucro: 100 };
                    const precoFinal = calcularPrecoFinal(custoBase, linha, produto.nome);
                    
                    const formula = Object.keys(produto.formula).map(ing => 
                        `<div class="formula-item"><span>${ing}</span><span>${produto.formula[ing]}g</span></div>`

                    html += `
                        <div class="product-card" style="border: 2px solid var(--gold); position: relative;">
                            <div style="position: absolute; top: 1rem; right: 1rem;">
                                <button style="background: #ff6b6b; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 3px; cursor: pointer; font-size: 0.8rem;" onclick="deletarProdutoCustomizado('${linha}', '${produto.nome.replace(/'/g, "\\'")}')">🗑️ Deletar</button>
                            </div>
                            <div class="product-name">${produto.nome} <span style="color: var(--gold); font-size: 0.75rem;">● CUSTOMIZADO</span></div>

                            <div class="formula-list">${formula}</div>

                            </div>

                            <div class="markup-section">
                                <div class="markup-title">Editar Percentuais (%)</div>
                                <div class="markup-grid">
                                    <div class="markup-input">
                                        <input type="number" step="1" value="${perc.administrativo}" 
                                            onchange="percentuais['${packKey}'].administrativo = parseFloat(this.value) || 0; renderProdutos();">
                                        <label>Administrativo</label>
                                    </div>
                                    <div class="markup-input">
                                        <input type="number" step="1" value="${perc.impostos}" 
                                            onchange="percentuais['${packKey}'].impostos = parseFloat(this.value) || 0; renderProdutos();">
                                        <label>Impostos</label>
                                    </div>
                                    <div class="markup-input">
                                        <input type="number" step="1" value="${perc.comissoes}" 
                                            onchange="percentuais['${packKey}'].comissoes = parseFloat(this.value) || 0; renderProdutos();">
                                        <label>Comissões</label>
                                    </div>
                                    <div class="markup-input">
                                        <input type="number" step="1" value="${perc.frete}" 
                                            onchange="percentuais['${packKey}'].frete = parseFloat(this.value) || 0; renderProdutos();">
                                        <label>Frete</label>
                                    </div>
                                    <div class="markup-input">
                                        <input type="number" step="1" value="${perc.lucro}" 
                                            onchange="percentuais['${packKey}'].lucro = parseFloat(this.value) || 0; renderProdutos();">
                                        <label>Lucro</label>
                                    </div>
                                </div>

                                <div class="markup-title">Breakdown do Preço Final</div>
                                <div class="breakdown">
                                    <div class="breakdown-item">
                                        <span>Custo Base:</span>
                                        <span>R$ ${custoBase.toFixed(2)}</span>
                                    </div>
                                    <div class="breakdown-item">
                                        <span>+ Administrativo (${perc.administrativo}%):</span>
                                        <span>R$ ${precoFinal.administrativo.toFixed(2)}</span>
                                    </div>
                                    <div class="breakdown-item">
                                        <span>+ Impostos (${perc.impostos}%):</span>
                                        <span>R$ ${precoFinal.impostos.toFixed(2)}</span>
                                    </div>
                                    <div class="breakdown-item">
                                        <span>+ Comissões (${perc.comissoes}%):</span>
                                        <span>R$ ${precoFinal.comissoes.toFixed(2)}</span>
                                    </div>
                                    <div class="breakdown-item">
                                        <span>+ Frete (${perc.frete}%):</span>
                                        <span>R$ ${precoFinal.frete.toFixed(2)}</span>
                                    </div>
                                    <div class="breakdown-item">
                                        <span>+ Lucro (${perc.lucro}%):</span>
                                        <span>R$ ${precoFinal.lucro.toFixed(2)}</span>
                                    </div>
                                    <div class="breakdown-item total">
                                        <span>PREÇO FINAL DE VENDA:</span>

                });
                
                html += '</div>';
                section.innerHTML = html;
                container.appendChild(section);

        }

        function renderEmbalagem() {
            const container = document.getElementById('linhasEmbalagem');
            container.innerHTML = '';
            
            Object.keys(linhas).forEach(linha => {
                const section = document.createElement('div');
                section.className = 'section';
                
                let html = `<div class="line-title">${linha}</div>`;
                
                linhas[linha].forEach(produto => {
                    const packKey = `${linha}-${produto.nome}`;
                    const pack = packaging[packKey] || { tampa: 0, rotulo: 0, embalagem: 0 };
                    
                    html += `
                        <div style="margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid #e0dcd7;">
                            <div style="font-weight: 600; margin-bottom: 1rem; color: var(--dark);">${produto.nome}</div>
                            <div class="inline-group">
                                <div class="form-group">
                                    <label>Tampa (R$)</label>
                                    <input type="number" step="0.01" value="${pack.tampa}" 
                                        onchange="packaging['${packKey}'].tampa = parseFloat(this.value) || 0; renderProdutos();">
                                </div>
                                <div class="form-group">
                                    <label>Rótulo (R$)</label>
                                    <input type="number" step="0.01" value="${pack.rotulo}" 
                                        onchange="packaging['${packKey}'].rotulo = parseFloat(this.value) || 0; renderProdutos();">
                                </div>
                                <div class="form-group">
                                    <label>Embalagem (R$)</label>
                                    <input type="number" step="0.01" value="${pack.embalagem}" 
                                        onchange="packaging['${packKey}'].embalagem = parseFloat(this.value) || 0; renderProdutos();">
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                section.innerHTML = html;
                container.appendChild(section);
            });
        }

        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabName = this.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(tabName).classList.add('active');
                });
            });
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Estilo
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const gold = [212, 165, 116];
            
            // Título
            doc.setFontSize(20);
            doc.setTextColor(26, 26, 26);
            doc.text('Calculadora de Custos', pageWidth / 2, 20, { align: 'center' });
            
            // Data
            doc.setFontSize(10);
            doc.setTextColor(153, 153, 153);
            const dataAtual = new Date().toLocaleDateString('pt-BR');
            doc.text(`Gerado em: ${dataAtual}`, pageWidth / 2, 28, { align: 'center' });
            
            let yPos = 35;
            
            // Tabelas por linha
            Object.keys(linhas).forEach(linha => {
                // Verificar espaço para nova página
                if (yPos > pageHeight - 40) {
                    doc.addPage();
                    yPos = 20;
                }
                
                // Título da linha
                doc.setFontSize(12);
                doc.setTextColor(212, 165, 116);
                doc.text(linha, 15, yPos);
                yPos += 8;
                
                // Dados para a tabela
                const tableData = [];
                
                // Produtos padrão
                linhas[linha].forEach(p => {
                    const custo = calcularCustoProduto(p);
                    const packKey = `${linha}-${p.nome}`;
                    const pack = packaging[packKey] || { tampa: 0, rotulo: 0, embalagem: 0 };
                    const packTotal = pack.tampa + pack.rotulo + pack.embalagem;
                    const custoBase = custo + packTotal;
                    const precoFinal = calcularPrecoFinal(custoBase, linha, p.nome);
                    
                    tableData.push([
                        p.nome,
                        `${p.tamanho}g`,
                        `R$ ${custoBase.toFixed(2)}`,
                        `R$ ${precoFinal.total.toFixed(2)}`
                    ]);
                });
                
                // Produtos customizados
                produtosCustomizados.filter(p => p.linha === linha).forEach(p => {
                    const custo = calcularCustoProduto(p);
                    const packKey = `${linha}-${p.nome}`;
                    const pack = packaging[packKey] || { tampa: 0, rotulo: 0, embalagem: 0 };
                    const packTotal = pack.tampa + pack.rotulo + pack.embalagem;
                    const custoBase = custo + packTotal;
                    const precoFinal = calcularPrecoFinal(custoBase, linha, p.nome);
                    
                    tableData.push([
                        `${p.nome} *`,
                        `${p.tamanho}g`,
                        `R$ ${custoBase.toFixed(2)}`,
                        `R$ ${precoFinal.total.toFixed(2)}`
                    ]);
                });
                
                // Criar tabela se houver dados
                if (tableData.length > 0) {
                    doc.autoTable({
                        head: [['Produto', 'Tamanho', 'Custo Base', 'Preço Final']],
                        body: tableData,
                        startY: yPos,
                        margin: { left: 15, right: 15 },
                        headStyles: {
                            fillColor: gold,
                            textColor: 255,
                            fontStyle: 'bold',
                            fontSize: 9,
                            halign: 'center'
                        },
                        bodyStyles: {
                            fontSize: 8,
                            textColor: 26,
                            halign: 'left'
                        },
                        alternateRowStyles: {
                            fillColor: [249, 247, 244]
                        },
                        columnStyles: {
                            1: { halign: 'center' },
                            2: { halign: 'right' },
                            3: { halign: 'right', textColor: gold }
                        },
                        didDrawPage: (data) => {
                            yPos = data.lastAutoTable.finalY + 10;
                        }
                    });
                    
                    yPos = doc.lastAutoTable.finalY + 10;
                }
            });
            
            // Footer
            doc.setFontSize(8);
            doc.setTextColor(153, 153, 153);
            doc.text('* Produtos customizados', 15, pageHeight - 10);
            
            // Download
            doc.save('custos-cosmeticos.pdf');
            
            const msg = document.getElementById('successMsg');
            msg.innerHTML = '<div class="success-msg">✅ PDF exportado com sucesso!</div>';
            setTimeout(() => {
                msg.innerHTML = '';
            }, 3000);
        }

        function exportarDados() {
            const dados = {};
            Object.keys(linhas).forEach(linha => {
                dados[linha] = [];
                
                // PADRÃO
                linhas[linha].forEach(p => {
                    const custo = calcularCustoProduto(p);
                    const packKey = `${linha}-${p.nome}`;
                    const pack = packaging[packKey] || { tampa: 0, rotulo: 0, embalagem: 0 };
                    const packTotal = pack.tampa + pack.rotulo + pack.embalagem;
                    const custoBase = custo + packTotal;
                    const precoFinal = calcularPrecoFinal(custoBase, linha, p.nome);
                    
                    dados[linha].push({
                        nome: p.nome,
                        tamanho: p.tamanho,
                        custoMateriaisPrimas: parseFloat(custo.toFixed(2)),
                        custoEmbalagem: parseFloat(packTotal.toFixed(2)),
                        custoBase: parseFloat(custoBase.toFixed(2)),
                        embalagem: pack,
                        percentuais: percentuais[packKey],
                        breakdown: {
                            administrativo: parseFloat(precoFinal.administrativo.toFixed(2)),
                            impostos: parseFloat(precoFinal.impostos.toFixed(2)),
                            comissoes: parseFloat(precoFinal.comissoes.toFixed(2)),
                            frete: parseFloat(precoFinal.frete.toFixed(2)),
                            lucro: parseFloat(precoFinal.lucro.toFixed(2))
                        },
                        precoFinalVenda: parseFloat(precoFinal.total.toFixed(2)),
                        customizado: false
                    });
                });

                // CUSTOMIZADOS
                produtosCustomizados.filter(p => p.linha === linha).forEach(p => {
                    const custo = calcularCustoProduto(p);
                    const packKey = `${linha}-${p.nome}`;
                    const pack = packaging[packKey] || { tampa: 0, rotulo: 0, embalagem: 0 };
                    const packTotal = pack.tampa + pack.rotulo + pack.embalagem;
                    const custoBase = custo + packTotal;
                    const precoFinal = calcularPrecoFinal(custoBase, linha, p.nome);
                    
                    dados[linha].push({
                        nome: p.nome,
                        tamanho: p.tamanho,
                        custoMateriaisPrimas: parseFloat(custo.toFixed(2)),
                        custoEmbalagem: parseFloat(packTotal.toFixed(2)),
                        custoBase: parseFloat(custoBase.toFixed(2)),
                        embalagem: pack,
                        percentuais: percentuais[packKey],
                        breakdown: {
                            administrativo: parseFloat(precoFinal.administrativo.toFixed(2)),
                            impostos: parseFloat(precoFinal.impostos.toFixed(2)),
                            comissoes: parseFloat(precoFinal.comissoes.toFixed(2)),
                            frete: parseFloat(precoFinal.frete.toFixed(2)),
                            lucro: parseFloat(precoFinal.lucro.toFixed(2))
                        },
                        precoFinalVenda: parseFloat(precoFinal.total.toFixed(2)),
                        customizado: true
                    });
                });
            });
            
            const dataStr = JSON.stringify(dados, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'custos-cosmeticos.json';
            link.click();
            
            const msg = document.getElementById('successMsg');
            msg.innerHTML = '<div class="success-msg">✅ Dados exportados com sucesso!</div>';
            setTimeout(() => {
                msg.innerHTML = '';
            }, 3000);
        }

        // START
        verificarAutenticacao();
    </script>
</body>
